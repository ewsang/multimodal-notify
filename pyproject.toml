[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-notify"
version = "0.2.0"
description = "Modular multimodal event detection and notification framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "discord.py>=2.4.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pyobjc-framework-Vision>=12.2.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["multimodal_notify*"]

[tool.setuptools.package-data]
"multimodal_notify.profiles" = ["*.yaml", "*.YAML"]

[project.scripts]
multimodal_notify = "multimodal_notify.cli:main"
